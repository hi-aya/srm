site_name: Supplier Risk Management (SRM)
site_description: AI-powered Supplier Risk Management platform
site_author: SRM Team

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

nav:
  - Accueil: index.md
  - Architecture IA:
      - Classification & RAG: ai_classification_rag.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code

plugins:
  - search
